name: Fix dateModified Freshness (one-time)

# Run this ONCE to stop stamping every comparison page's dateModified with
# today's date on every rebuild, and start tracking real per-comparison
# freshness in data/cache/freshness_state.json instead.
# Delete this workflow file and fix_datemodified_freshness.py from the repo
# root after this succeeds. Safe to re-run — skips if already applied.

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run patcher
        run: python3 fix_datemodified_freshness.py

      - name: Sanity-check the patched file imports cleanly
        run: |
          cd scripts
          python3 -c "import ast; ast.parse(open('publish_github_pages.py').read())"
          echo "Syntax OK"

      - name: Confirm freshness tracking is present
        run: |
          grep -q "freshness_state" scripts/publish_github_pages.py
          echo "Fix confirmed"

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/publish_github_pages.py
          git diff --staged --quiet && echo "Nothing to commit (already patched)" || git commit -m "Track real per-comparison freshness instead of stamping dateModified on every run"
          git push
