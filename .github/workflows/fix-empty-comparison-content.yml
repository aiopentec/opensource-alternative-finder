name: Fix Empty Comparison Content (one-time)

# Run this ONCE to stop generate_comparison.py from silently accepting an
# empty/meta-only response from Groq and marking it 'generated'. Adds
# content validation that falls through Groq -> Gemini -> template
# instead. The next full pipeline run after this will naturally
# regenerate real content for jira-vs-plane, mailchimp-vs-listmonk,
# openai-api-vs-ollama, and quickbooks-vs-dolibarr (currently empty)
# and hubspot-vs-suitecrm (currently too short) — no separate backfill
# needed.
# Delete this workflow file and fix_empty_comparison_content.py from the
# repo root after this succeeds. Safe to re-run — skips if already applied.

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run patcher
        run: python3 fix_empty_comparison_content.py

      - name: Sanity-check the patched file imports cleanly
        run: |
          cd scripts
          python3 -c "import ast; ast.parse(open('generate_comparison.py').read())"
          echo "Syntax OK"

      - name: Confirm validation logic is present
        run: |
          grep -q "_content_is_valid" scripts/generate_comparison.py
          echo "Fix confirmed"

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_comparison.py
          git diff --staged --quiet && echo "Nothing to commit (already patched)" || git commit -m "Validate AI content before accepting it, instead of silently shipping empty comparisons"
          git push
