name: Expand Thin Migrate Pages

# Manual-trigger only. Use "limit" to test on a handful of pairs first
# (e.g. 4), then re-run with limit left blank/0 to process everything
# still missing content. Safe to re-run — pairs already in
# data/cache/migrate_content.json are skipped unless you check "force".
#
# To regenerate one or a few specific pairs (e.g. fixing a typo in one
# pair's content), fill in "slugs" as a comma-separated list of
# prop-to-oss slugs (e.g. "notion-to-appflowy") and check "force" — this
# targets only those pairs regardless of what "limit" says.
#
# The commit step runs even if generation partially fails or times out
# (if: always()), so whatever succeeded before a failure still gets saved
# instead of being lost. timeout-minutes is capped well below GitHub's
# 6-hour default so a stuck run fails fast rather than burning hours.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process this many pairs (blank or 0 = all remaining)"
        required: false
        default: "4"
      force:
        description: "Regenerate even pairs that already have cached content"
        required: false
        default: false
        type: boolean
      slugs:
        description: "Comma-separated slugs to target specifically (e.g. notion-to-appflowy) — leave blank to process normally"
        required: false
        default: ""

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Generate expanded content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slugs }}" ]; then
            ARGS="$ARGS --slugs ${{ inputs.slugs }}"
          elif [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python3 scripts/migrate_content_generator.py $ARGS

      - name: Rebuild site locally (for audit only — not deployed from here)
        if: always()
        env:
          SITE_BASE_URL: https://osalfinder.com
        run: |
          mkdir -p .cache/publish
          cp data/cache/comparisons_*.json .cache/publish/ 2>/dev/null || true
          python3 scripts/publish_github_pages.py

      - name: Audit word counts
        if: always()
        run: |
          python3 scripts/thin_content_audit.py --dir site --threshold 200 --csv data/audit_report.csv | tee audit_output.txt
          {
            echo "## Thin Content Audit"
            echo ""
            echo '```'
            cat audit_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated content cache and audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/migrate_content.json data/audit_report.csv
          git diff --staged --quiet && echo "Nothing new to commit" || git commit -m "Expand migrate-* page content [skip ci]"
          git push || echo "Nothing to push"
