name: Fix About Page Disclosure (one-time)

# Run this ONCE, after pipeline.yml has been updated with the "Audit
# Migrate Page Content" gate. Rewords the About page's quality-control
# disclosure to accurately describe that real automated check instead of
# implying no quality control exists at all.
# Delete this workflow file and fix_about_page_disclosure.py from the repo
# root after this succeeds. Safe to re-run — skips if already applied.

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run patcher
        run: python3 fix_about_page_disclosure.py

      - name: Sanity-check the patched file imports cleanly
        run: |
          cd scripts
          python3 -c "import ast; ast.parse(open('publish_github_pages.py').read())"
          echo "Syntax OK"

      - name: Confirm new wording is present
        run: |
          grep -q "content-quality audit measures" scripts/publish_github_pages.py
          echo "Fix confirmed"

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/publish_github_pages.py
          git diff --staged --quiet && echo "Nothing to commit (already patched)" || git commit -m "Honestly describe the automated content-quality gate on the About page"
          git push
