name: Generate Pinterest Pins

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Which template(s) to render'
        required: false
        default: 'ab'
        type: choice
        options: [ab, a, b]
      team_size:
        description: 'Team size for savings calculation'
        required: false
        default: '25'
      limit:
        description: 'Limit to first N comparisons (leave blank for all)'
        required: false
        default: ''

jobs:
  generate-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug — show repo cache structure
        run: |
          echo "=== Root level ==="
          ls -la
          echo ""
          echo "=== data/ (if exists) ==="
          ls -la data/ 2>/dev/null || echo "data/ not found"
          echo ""
          echo "=== data/cache/ (if exists) ==="
          ls -la data/cache/ 2>/dev/null || echo "data/cache/ not found"
          echo ""
          echo "=== .cache/ (if exists) ==="
          ls -la .cache/ 2>/dev/null || echo ".cache/ not found"
          echo ""
          echo "=== .cache/publish/ (if exists) ==="
          ls -la .cache/publish/ 2>/dev/null || echo ".cache/publish/ not found"
          echo ""
          echo "=== Searching all JSON files in repo ==="
          find . -name "*.json" | grep -v node_modules | grep -v ".git" | head -30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Generate pins
        run: |
          ARGS="--template ${{ github.event.inputs.template }} --team-size ${{ github.event.inputs.team_size }}"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/generate_pinterest_pins.py $ARGS

      - name: Upload pins as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-pins
          path: pinterest_pins/
          retention-days: 7
