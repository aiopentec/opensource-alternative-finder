  <style>
    :root {
      --blue: #1F5C99; --blue-light: #2980B9;
      --green: #0D9966; --green-light: #10b77a;
      --red: #e03e3e; --gold: #f5a623;
      --bg: #0a0f1e; --card: #111827; --card2: #1a2236;
      --border: rgba(255,255,255,0.08);
      --text: #f0f4ff; --muted: #8899bb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; line-height: 1.6;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(31,92,153,0.06) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(31,92,153,0.06) 1px,transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    nav {
      position: relative; z-index: 10;
      background: rgba(10,15,30,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem; display: flex; align-items: center; gap: 0.75rem;
    }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.15s; }
    nav a:hover { color: var(--text); }
    nav .sep { color: rgba(255,255,255,0.2); }
    nav .current { color: var(--text); font-weight: 600; }

    .hero {
      position: relative; z-index: 1;
      text-align: center; padding: 3.5rem 1.5rem 2rem;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(245,166,35,0.15); border: 1px solid rgba(245,166,35,0.3);
      color: var(--gold); font-size: 0.78rem; font-weight: 700;
      padding: 0.3rem 0.9rem; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1.2rem;
    }
    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      font-weight: 800; line-height: 1.1; margin-bottom: 0.9rem;
      background: linear-gradient(135deg, #fff 30%, #63b3ed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--muted); font-size: 1rem; max-width: 500px; margin: 0 auto; }

    /* Progress bar */
    .progress-wrap {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto 1.5rem; padding: 0 1.5rem;
    }
    .progress-labels {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem;
    }
    .progress-track {
      height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 6px; border-radius: 3px;
      background: linear-gradient(to right, var(--blue), var(--green));
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    /* Quiz card */
    .quiz-wrap {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto 3rem; padding: 0 1.5rem;
    }
    .quiz-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .q-num {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;
    }
    .q-text {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem; font-weight: 700; color: #fff;
      margin-bottom: 1.5rem; line-height: 1.3;
    }
    .options { display: flex; flex-direction: column; gap: 0.65rem; }
    .option {
      display: flex; align-items: center; gap: 0.9rem;
      background: var(--card2); border: 2px solid var(--border);
      border-radius: 10px; padding: 0.85rem 1rem;
      cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .option:hover { border-color: rgba(31,92,153,0.6); background: rgba(31,92,153,0.1); }
    .option.selected { border-color: var(--green); background: rgba(13,153,102,0.12); }
    .option-letter {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 800; color: var(--muted);
      transition: all 0.15s;
    }
    .option.selected .option-letter { background: var(--green); border-color: var(--green); color: #fff; }
    .option-text { font-size: 0.92rem; color: var(--text); line-height: 1.4; }
    .option-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; font-style: italic; }

    .next-btn {
      margin-top: 1.5rem; width: 100%;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: #fff; border: none; padding: 0.85rem;
      border-radius: 10px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s; opacity: 0.4;
      pointer-events: none;
    }
    .next-btn.active { opacity: 1; pointer-events: all; }
    .next-btn.active:hover { opacity: 0.9; }

    /* Results */
    .results-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideIn 0.4s cubic-bezier(0.4,0,0.2,1);
      display: none;
    }
    .results-header { text-align: center; margin-bottom: 2rem; }
    .score-ring {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800;
    }
    .score-ring.high   { background: rgba(13,153,102,0.2); border: 3px solid var(--green); color: var(--green-light); }
    .score-ring.medium { background: rgba(245,166,35,0.2); border: 3px solid var(--gold); color: var(--gold); }
    .score-ring.low    { background: rgba(224,62,62,0.2); border: 3px solid var(--red); color: #ff6b6b; }
    .results-title {
      font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: #fff;
      margin-bottom: 0.4rem;
    }
    .results-sub { font-size: 0.9rem; color: var(--muted); }

    .recs-section { margin-bottom: 1.75rem; }
    .recs-label {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.85rem;
    }
    .rec-card {
      background: var(--card2); border-radius: 10px; padding: 1rem 1.1rem;
      margin-bottom: 0.65rem; border-left: 3px solid;
    }
    .rec-card.easy   { border-color: var(--green); }
    .rec-card.medium { border-color: var(--gold); }
    .rec-card.hard   { border-color: var(--red); }
    .rec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.3rem; }
    .rec-tools { font-weight: 700; font-size: 0.92rem; color: #fff; }
    .rec-badge {
      font-size: 0.7rem; font-weight: 800; padding: 0.15rem 0.55rem;
      border-radius: 20px; white-space: nowrap;
    }
    .rec-badge.easy   { background: rgba(13,153,102,0.2); color: var(--green-light); }
    .rec-badge.medium { background: rgba(245,166,35,0.2); color: var(--gold); }
    .rec-badge.hard   { background: rgba(224,62,62,0.2); color: #ff8080; }
    .rec-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
    .rec-link { font-size: 0.8rem; color: #63b3ed; text-decoration: none; display: inline-block; margin-top: 0.35rem; }
    .rec-link:hover { color: #fff; }

    .action-box {
      background: linear-gradient(135deg, rgba(31,92,153,0.25), rgba(31,92,153,0.1));
      border: 1px solid rgba(31,92,153,0.4); border-radius: 12px;
      padding: 1.25rem 1.4rem; margin-bottom: 1.25rem;
    }
    .action-box h3 { font-size: 0.92rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
    .action-box p { font-size: 0.82rem; color: var(--muted); }

    .result-btns { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn-primary {
      flex: 1; background: linear-gradient(135deg, var(--blue), var(--blue-light));
      color: #fff; padding: 0.7rem 1.2rem; border-radius: 8px;
      text-decoration: none; font-weight: 700; font-size: 0.88rem;
      text-align: center; min-width: 140px;
    }
    .btn-secondary {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--muted); padding: 0.7rem 1.2rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 0.88rem;
      text-align: center; min-width: 140px; cursor: pointer;
    }
    .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 2rem;
      border-top: 1px solid var(--border); color: var(--muted); font-size: 0.82rem;
    }
    footer a { color: #63b3ed; }

    @media (max-width: 600px) {
      .quiz-card, .results-card { padding: 1.4rem; }
      .result-btns { flex-direction: column; }
    }
  </style>

<script>
const QUESTIONS = [
  {
    text: "How technical is your team?",
    options: [
      { letter: "A", text: "Very technical", sub: "Developers, DevOps, or SysAdmins on the team", score: 3 },
      { letter: "B", text: "Somewhat technical", sub: "At least one person comfortable with servers", score: 2 },
      { letter: "C", text: "Non-technical", sub: "No one who can manage a server", score: 1 },
      { letter: "D", text: "Mixed team", sub: "Some technical, mostly non-technical", score: 2 },
    ]
  },
  {
    text: "What's your monthly SaaS budget right now?",
    options: [
      { letter: "A", text: "Over $2,000/month", sub: "Strong financial reason to switch", score: 3 },
      { letter: "B", text: "$500 – $2,000/month", sub: "Meaningful savings available", score: 2 },
      { letter: "C", text: "Under $500/month", sub: "Savings exist but less urgent", score: 1 },
      { letter: "D", text: "Not sure", sub: "Haven't calculated it yet", score: 1 },
    ]
  },
  {
    text: "How much downtime can your team tolerate during migration?",
    options: [
      { letter: "A", text: "A full weekend", sub: "We can plan a maintenance window", score: 3 },
      { letter: "B", text: "A few hours", sub: "Off-peak migration is fine", score: 2 },
      { letter: "C", text: "Zero downtime", sub: "Mission critical — must stay live", score: 1 },
      { letter: "D", text: "A few days gradually", sub: "We can migrate tool by tool", score: 3 },
    ]
  },
  {
    text: "How sensitive is your team's data?",
    options: [
      { letter: "A", text: "Not sensitive", sub: "Public or low-risk information", score: 3 },
      { letter: "B", text: "Moderately sensitive", sub: "Internal business data", score: 2 },
      { letter: "C", text: "Highly sensitive", sub: "Healthcare, legal, financial, or regulated data", score: 3 },
      { letter: "D", text: "Very sensitive", sub: "Government, defence, or classified", score: 3 },
    ]
  },
  {
    text: "Which tools are you most interested in replacing?",
    options: [
      { letter: "A", text: "Productivity (Notion, Slack, Zoom)", sub: "Communication and knowledge management", score: 2, focus: "productivity" },
      { letter: "B", text: "Design (Figma, Adobe, Canva)", sub: "Creative and design tools", score: 2, focus: "design" },
      { letter: "C", text: "Dev Tools (GitHub, Jira, Postman)", sub: "Engineering and project tools", score: 3, focus: "devtools" },
      { letter: "D", text: "Everything — full stack", sub: "Comprehensive switch across all tools", score: 2, focus: "all" },
    ]
  }
];

const RECS = {
  productivity: [
    { prop: "Slack", oss: "Mattermost", ease: "easy",   slug: "slack-vs-mattermost",   why: "One Docker command, Slack-like UI, Slack import tool built in." },
    { prop: "Notion", oss: "AppFlowy",  ease: "easy",   slug: "notion-vs-appflowy",    why: "Download and run, no server needed. Local-first storage." },
    { prop: "Zoom",  oss: "Jitsi Meet", ease: "easy",   slug: "zoom-vs-jitsi",         why: "No install, no account needed. Works in any browser." },
    { prop: "Mailchimp", oss: "Listmonk", ease: "medium", slug: "mailchimp-vs-listmonk", why: "Single Docker container, handles millions of emails cheaply." },
  ],
  design: [
    { prop: "Figma",  oss: "Penpot",    ease: "easy",   slug: "figma-vs-penpot",              why: "Browser-based, real-time collaboration, import SVG from Figma." },
    { prop: "Adobe Illustrator", oss: "Inkscape", ease: "easy", slug: "adobe-illustrator-vs-inkscape", why: "Download and install, full vector editor, no subscription." },
    { prop: "Adobe Premiere", oss: "Kdenlive",  ease: "easy",   slug: "adobe-premiere-vs-kdenlive",    why: "Install and run, professional video editing, free forever." },
    { prop: "Miro",   oss: "Excalidraw", ease: "easy",  slug: "miro-vs-excalidraw",           why: "Works in the browser instantly, no account required." },
  ],
  devtools: [
    { prop: "GitHub",  oss: "Gitea",    ease: "easy",   slug: "github-vs-gitea",         why: "20 minute Docker setup, runs on a Raspberry Pi, full Git hosting." },
    { prop: "Jira",    oss: "Plane",    ease: "easy",   slug: "jira-vs-plane",           why: "Docker Compose, modern UI, much faster than Jira." },
    { prop: "Postman", oss: "Hoppscotch", ease: "easy", slug: "postman-vs-hoppscotch",   why: "Browser-based, no install, full API testing." },
    { prop: "Sentry",  oss: "GlitchTip", ease: "medium", slug: "sentry-vs-glitchtip",   why: "Sentry SDK compatible, simple Docker setup." },
  ],
  all: [
    { prop: "Figma",  oss: "Penpot",    ease: "easy",   slug: "figma-vs-penpot",         why: "Start here — zero cost, browser-based, biggest savings." },
    { prop: "Slack",  oss: "Mattermost", ease: "easy",  slug: "slack-vs-mattermost",     why: "Biggest team communication win, Slack import built in." },
    { prop: "Jira",   oss: "Plane",     ease: "easy",   slug: "jira-vs-plane",           why: "Developers love it — faster and cleaner than Jira." },
    { prop: "GitHub", oss: "Gitea",     ease: "easy",   slug: "github-vs-gitea",         why: "Full Git hosting, 20 minute setup, runs anywhere." },
  ]
};

const EASE_LABELS = { easy: "Switch Now", medium: "Switch Soon", hard: "Plan Carefully" };

let current = 0;
let answers = [];
let totalScore = 0;
let focus = "all";

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('q-num').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog-label').textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  const pct = Math.round(current / QUESTIONS.length * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${o.letter}</div>
      <div>
        <div class="option-text">${o.text}</div>
        ${o.sub ? `<div class="option-sub">${o.sub}</div>` : ''}
      </div>`;
    div.onclick = () => selectOption(i, o.score, o.focus);
    opts.appendChild(div);
  });

  const btn = document.getElementById('next-btn');
  btn.classList.remove('active');
  btn.textContent = current === QUESTIONS.length - 1 ? 'See My Results →' : 'Continue →';
}

function selectOption(idx, score, f) {
  document.querySelectorAll('.option').forEach((o, i) => {
    o.classList.toggle('selected', i === idx);
  });
  answers[current] = { score, focus: f };
  document.getElementById('next-btn').classList.add('active');
}

function nextQuestion() {
  if (!answers[current]) return;
  totalScore += answers[current].score;
  if (answers[current].focus) focus = answers[current].focus;
  current++;

  if (current >= QUESTIONS.length) {
    showResults();
  } else {
    // Re-animate
    const card = document.getElementById('quiz-card');
    card.style.animation = 'none';
    card.offsetHeight; // reflow
    card.style.animation = '';
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  document.getElementById('prog-label').textContent = 'Complete!';
  document.getElementById('quiz-card').style.display = 'none';

  const maxScore = QUESTIONS.length * 3;
  const pct = Math.round(totalScore / maxScore * 100);

  let level, label, desc, ringClass;
  if (pct >= 70) {
    level = 'high'; ringClass = 'high';
    label = "You're Ready to Switch! 🚀";
    desc = "Your team has the technical capability, budget motivation, and flexibility to migrate right now. Start with the easiest tools this week.";
  } else if (pct >= 45) {
    level = 'medium'; ringClass = 'medium';
    label = "Almost Ready — Plan It 📋";
    desc = "You can make the switch with some preparation. Pick 1–2 tools to migrate first, build confidence, then tackle the rest over the next quarter.";
  } else {
    level = 'low'; ringClass = 'low';
    label = "Take It Slow 🐢";
    desc = "Your situation calls for a careful approach. Start with zero-downtime tools that require no server, build familiarity, then tackle bigger migrations later.";
  }

  const recs = RECS[focus] || RECS.all;
  let easyRecs = recs.filter(r => r.ease === 'easy').slice(0, 2);
  let medRecs  = recs.filter(r => r.ease === 'medium').slice(0, 1);

  // If low score, only show easy
  if (level === 'low') medRecs = [];

  let recsHTML = '';
  if (easyRecs.length) {
    recsHTML += `<div class="recs-label">✅ Switch these right now</div>`;
    easyRecs.forEach(r => {
      recsHTML += `
        <div class="rec-card easy">
          <div class="rec-header">
            <div class="rec-tools">${r.prop} → <span style="color:var(--green-light)">${r.oss}</span></div>
            <div class="rec-badge easy">${EASE_LABELS[r.ease]}</div>
          </div>
          <div class="rec-desc">${r.why}</div>
          <a class="rec-link" href="../${r.slug}/">Read full comparison →</a>
        </div>`;
    });
  }
  if (medRecs.length) {
    recsHTML += `<div class="recs-label" style="margin-top:1.25rem">⏳ Plan these for next quarter</div>`;
    medRecs.forEach(r => {
      recsHTML += `
        <div class="rec-card medium">
          <div class="rec-header">
            <div class="rec-tools">${r.prop} → <span style="color:var(--gold)">${r.oss}</span></div>
            <div class="rec-badge medium">${EASE_LABELS[r.ease]}</div>
          </div>
          <div class="rec-desc">${r.why}</div>
          <a class="rec-link" href="../${r.slug}/">Read full comparison →</a>
        </div>`;
    });
  }

  const actionTip = level === 'high'
    ? { title: "💡 Your first move this week", body: "Pick the easiest tool above and follow the migration guide. Most teams complete their first migration in under 4 hours." }
    : level === 'medium'
    ? { title: "💡 Your first move", body: "Use the savings calculator to make the business case to your team. Then pick one low-risk tool to migrate as a pilot." }
    : { title: "💡 Start here", body: "Try Jitsi Meet or Penpot — both work in the browser with no server setup. Zero commitment, immediate value." };

  const resultsEl = document.getElementById('results-card');
  resultsEl.style.display = 'block';
  resultsEl.innerHTML = `
    <div class="results-header">
      <div class="score-ring ${ringClass}">${pct}%</div>
      <div class="results-title">${label}</div>
      <div class="results-sub">${desc}</div>
    </div>
    <div class="recs-section">${recsHTML}</div>
    <div class="action-box">
      <h3>${actionTip.title}</h3>
      <p>${actionTip.body}</p>
    </div>
    <div class="result-btns">
      <a class="btn-primary" href="../savings-calculator/">Calculate Exact Savings →</a>
      <div class="btn-secondary" onclick="restartQuiz()">Retake Quiz</div>
    </div>`;
}

function restartQuiz() {
  current = 0; answers = []; totalScore = 0; focus = "all";
  document.getElementById('results-card').style.display = 'none';
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('prog-fill').style.width = '0%';
  renderQuestion();
}

// Init
renderQuestion();
</script>
</body>
</html>
